<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>Nur</title>
  <meta name="description" content="Habits, Gebetszeiten, Kalender und Deep-Work-Fokus. 100 % offline.">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nur">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <style>
    #splash { position: fixed; inset: 0; background: #000; display: grid; place-items: center; z-index: 1000; transition: opacity .5s ease .1s; }
    body.ready #splash { opacity: 0; pointer-events: none; }
    #splash img { width: 92px; height: 92px; border-radius: 22px; animation: sp 1.4s ease-in-out infinite alternate; }
    @keyframes sp { from { transform: scale(.94); opacity: .7; } to { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/icon-192.png" alt=""></div>
  <div id="app"></div>
  <div id="sheets"></div>
  <div id="toasts" aria-live="polite"></div>
  <noscript>Bitte JavaScript aktivieren.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
